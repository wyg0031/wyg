<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号管理 - 织金县文明传播志愿服务队人员信息管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        :root {
            --primary-color: #e74c3c;
            --primary-dark: #c0392b;
            --primary-light: #ffe5e5;
            --secondary-color: #ffffff;
            --success-color: #27ae60;
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
            --info-color: #3498db;
            --terminal-bg: #0a0000;
            --terminal-text: #ffffff;
            --terminal-green: #e74c3c;
            --terminal-blue: #ff4444;
            --terminal-yellow: #ffaa00;
            --terminal-red: #ff0000;
            --terminal-purple: #cc0066;
            --terminal-cyan: #ff6666;
            --sidebar-bg: #140000;
            --sidebar-hover: #1a0000;
            --sidebar-active: #220000;
            --card-bg: rgba(20, 0, 0, 0.95);
            --border-color: #8b0000;
            --tech-red: #ffffff;
            --tech-dark-red: #8b0000;
            --tech-glow: rgba(255, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--terminal-bg);
            color: var(--terminal-text);
            min-height: 100vh;
            background-image: 
                linear-gradient(rgba(10, 0, 0, 0.85), rgba(10, 0, 0, 0.85)),
                url('Image_1766735724682_850.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .container-fluid {
            padding: 20px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h2 {
            font-size: 28px;
            font-weight: 600;
            color: var(--tech-red);
            margin-bottom: 10px;
            text-shadow: 0 0 10px var(--tech-glow);
        }

        .page-header p {
            color: #8b949e;
            font-size: 14px;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--tech-dark-red);
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 0 15px var(--tech-glow);
        }

        .card-header {
            background: rgba(20, 0, 0, 0.95);
            border-bottom: 2px solid var(--tech-dark-red);
            padding: 20px;
            border-radius: 12px 12px 0 0;
        }

        .card-header h4 {
            color: var(--tech-red);
            font-size: 18px;
            font-weight: 600;
            margin: 0;
            text-shadow: 0 0 10px var(--tech-glow);
        }

        .card-body {
            padding: 20px;
        }

        .btn {
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--tech-red), #cc0000);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #cc0000, #990000);
            transform: translateY(-2px);
            box-shadow: 0 0 20px var(--tech-glow);
        }

        .btn-secondary {
            background: rgba(139, 0, 0, 0.8);
            color: var(--terminal-text);
            border: 2px solid var(--tech-dark-red);
        }

        .btn-secondary:hover {
            background: rgba(139, 0, 0, 1);
            box-shadow: 0 0 10px var(--tech-glow);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--tech-red), #cc0000);
            color: white;
        }

        .btn-danger:hover {
            background: linear-gradient(135deg, #cc0000, #990000);
            transform: translateY(-2px);
            box-shadow: 0 0 20px var(--tech-glow);
        }

        .btn-warning {
            background: linear-gradient(135deg, var(--terminal-yellow), #cc9900);
            color: white;
        }

        .btn-warning:hover {
            background: linear-gradient(135deg, #cc9900, #997300);
            transform: translateY(-2px);
            box-shadow: 0 0 20px var(--tech-glow);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .table {
            background: transparent;
            color: var(--terminal-text);
        }

        .table thead th {
            background: rgba(20, 0, 0, 0.95);
            border-bottom: 2px solid var(--tech-dark-red);
            color: var(--tech-red);
            font-weight: 600;
            padding: 15px;
            font-size: 14px;
        }

        .table tbody td {
            border-bottom: 1px solid var(--tech-dark-red);
            padding: 15px;
            font-size: 14px;
            vertical-align: middle;
        }

        .table tbody tr:hover {
            background: rgba(255, 0, 0, 0.1);
            box-shadow: 0 0 10px var(--tech-glow);
        }

        .badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-success {
            background: rgba(255, 0, 0, 0.15);
            color: var(--tech-red);
            border: 2px solid var(--tech-dark-red);
        }

        .badge-info {
            background: rgba(255, 68, 68, 0.15);
            color: var(--terminal-blue);
            border: 2px solid var(--tech-dark-red);
        }

        .badge-warning {
            background: rgba(255, 170, 0, 0.15);
            color: var(--terminal-yellow);
            border: 2px solid var(--tech-dark-red);
        }

        .form-control {
            background: rgba(10, 0, 0, 0.8);
            border: 2px solid var(--tech-dark-red);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--terminal-text);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(10, 0, 0, 0.9);
            border-color: var(--tech-red);
            box-shadow: 0 0 15px var(--tech-glow);
            outline: none;
        }

        .form-control::placeholder {
            color: rgba(255, 204, 204, 0.5);
        }

        .form-group label {
            color: var(--terminal-text);
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--tech-dark-red);
            border-radius: 12px;
            box-shadow: 0 8px 32px var(--tech-glow);
        }

        .modal-header {
            background: rgba(20, 0, 0, 0.95);
            border-bottom: 2px solid var(--tech-dark-red);
            border-radius: 12px 12px 0 0;
            padding: 20px;
        }

        .modal-title {
            color: var(--tech-red);
            font-size: 18px;
            font-weight: 600;
            text-shadow: 0 0 10px var(--tech-glow);
        }

        .modal-body {
            padding: 20px;
        }

        .modal-footer {
            background: rgba(20, 0, 0, 0.95);
            border-top: 2px solid var(--tech-dark-red);
            border-radius: 0 0 12px 12px;
            padding: 20px;
        }

        .close {
            color: var(--terminal-text);
            opacity: 0.7;
        }

        .close:hover {
            opacity: 1;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box .form-control {
            flex: 1;
        }

        .stats-card {
            background: rgba(20, 0, 0, 0.95);
            border: 2px solid var(--tech-dark-red);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px var(--tech-glow);
        }

        .stats-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 25px var(--tech-glow);
        }

        .stats-card .icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .stats-card .number {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stats-card .label {
            color: var(--secondary-color);
            font-size: 14px;
        }

        .stats-green .icon { color: var(--tech-red); }
        .stats-green .number { color: var(--tech-red); }

        .stats-blue .icon { color: var(--terminal-blue); }
        .stats-blue .number { color: var(--terminal-blue); }

        .stats-yellow .icon { color: var(--terminal-yellow); }
        .stats-yellow .number { color: var(--terminal-yellow); }

        .alert {
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            margin-bottom: 20px;
            border: none;
        }

        .alert-danger {
            background: rgba(248, 81, 73, 0.1);
            color: var(--terminal-red);
            border: 1px solid rgba(248, 81, 73, 0.3);
        }

        .alert-success {
            background: rgba(63, 185, 80, 0.1);
            color: var(--terminal-green);
            border: 1px solid rgba(63, 185, 80, 0.3);
        }

        .action-buttons {
            display: flex;
            gap: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #8b949e;
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h4 {
            font-size: 20px;
            margin-bottom: 10px;
            color: var(--terminal-text);
        }

        .empty-state p {
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .container-fluid {
                padding: 10px;
            }

            .page-header h2 {
                font-size: 24px;
            }

            .card {
                margin-bottom: 15px;
            }

            .table-responsive {
                font-size: 12px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn-sm {
                width: 100%;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="page-header">
            <h2><i class="fas fa-users-cog" style="margin-right: 10px; color: var(--terminal-green);"></i>账号管理</h2>
            <p>管理系统用户账号，包括添加、编辑和删除账号</p>
        </div>

        <div class="row mb-4">
            <div class="col-md-4">
                <div class="stats-card stats-green">
                    <div class="icon"><i class="fas fa-users"></i></div>
                    <div class="number" id="total-users">0</div>
                    <div class="label">总账号数</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stats-card stats-blue">
                    <div class="icon"><i class="fas fa-user-shield"></i></div>
                    <div class="number" id="admin-users">0</div>
                    <div class="label">管理员账号</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stats-card stats-yellow">
                    <div class="icon"><i class="fas fa-user"></i></div>
                    <div class="number" id="regular-users">0</div>
                    <div class="label">普通用户账号</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center">
                    <h4><i class="fas fa-list" style="margin-right: 10px;"></i>账号列表</h4>
                    <button class="btn btn-primary" onclick="openAddModal()">
                        <i class="fas fa-plus" style="margin-right: 5px;"></i>添加账号
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div class="search-box">
                    <input type="text" 
                           class="form-control" 
                           id="search-input" 
                           placeholder="搜索用户名、真实姓名或手机号码..."
                           oninput="handleSearch()">
                    <select class="form-control" id="role-filter" style="width: 150px;" onchange="handleSearch()">
                        <option value="">全部角色</option>
                        <option value="admin">管理员</option>
                        <option value="user">普通用户</option>
                    </select>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>用户名</th>
                                <th>真实姓名</th>
                                <th>手机号码</th>
                                <th>角色</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body">
                            <!-- 动态加载用户数据 -->
                        </tbody>
                    </table>
                </div>

                <div id="empty-state" class="empty-state" style="display: none;">
                    <i class="fas fa-inbox"></i>
                    <h4>暂无账号数据</h4>
                    <p>点击"添加账号"按钮创建第一个账号</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加账号模态框 -->
    <div class="modal fade" id="addModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-user-plus" style="margin-right: 10px;"></i>添加账号</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="add-form">
                        <div class="form-group">
                            <label for="add-username">用户名 *</label>
                            <input type="text" 
                                   class="form-control" 
                                   id="add-username" 
                                   placeholder="请输入用户名（3-20个字符）" 
                                   required
                                   pattern="[a-zA-Z0-9_]{3,20}"
                                   title="用户名只能包含字母、数字和下划线，长度3-20个字符">
                        </div>
                        <div class="form-group">
                            <label for="add-password">密码 *</label>
                            <input type="password" 
                                   class="form-control" 
                                   id="add-password" 
                                   placeholder="请输入密码（至少6个字符）" 
                                   required
                                   minlength="6">
                        </div>
                        <div class="form-group">
                            <label for="add-realname">真实姓名 *</label>
                            <input type="text" 
                                   class="form-control" 
                                   id="add-realname" 
                                   placeholder="请输入真实姓名" 
                                   required>
                        </div>
                        <div class="form-group">
                            <label for="add-phone">手机号码</label>
                            <input type="tel" 
                                   class="form-control" 
                                   id="add-phone" 
                                   placeholder="请输入手机号码"
                                   pattern="[0-9]{11}"
                                   title="请输入11位手机号码">
                        </div>
                        <div class="form-group">
                            <label for="add-role">角色 *</label>
                            <select class="form-control" id="add-role" required>
                                <option value="user">普通用户</option>
                                <option value="admin">管理员</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="handleAddUser()">
                        <i class="fas fa-plus" style="margin-right: 5px;"></i>添加
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 编辑账号模态框 -->
    <div class="modal fade" id="editModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-user-edit" style="margin-right: 10px;"></i>编辑账号</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="edit-form">
                        <input type="hidden" id="edit-id">
                        <div class="form-group">
                            <label for="edit-username">用户名 *</label>
                            <input type="text" 
                                   class="form-control" 
                                   id="edit-username" 
                                   placeholder="请输入用户名（3-20个字符）" 
                                   required
                                   pattern="[a-zA-Z0-9_]{3,20}"
                                   title="用户名只能包含字母、数字和下划线，长度3-20个字符">
                        </div>
                        <div class="form-group">
                            <label for="edit-password">密码（留空则不修改）</label>
                            <input type="password" 
                                   class="form-control" 
                                   id="edit-password" 
                                   placeholder="请输入新密码（至少6个字符）"
                                   minlength="6">
                        </div>
                        <div class="form-group">
                            <label for="edit-realname">真实姓名 *</label>
                            <input type="text" 
                                   class="form-control" 
                                   id="edit-realname" 
                                   placeholder="请输入真实姓名" 
                                   required>
                        </div>
                        <div class="form-group">
                            <label for="edit-phone">手机号码</label>
                            <input type="tel" 
                                   class="form-control" 
                                   id="edit-phone" 
                                   placeholder="请输入手机号码"
                                   pattern="[0-9]{11}"
                                   title="请输入11位手机号码">
                        </div>
                        <div class="form-group">
                            <label for="edit-role">角色 *</label>
                            <select class="form-control" id="edit-role" required>
                                <option value="user">普通用户</option>
                                <option value="admin">管理员</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="handleEditUser()">
                        <i class="fas fa-save" style="margin-right: 5px;"></i>保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 删除确认模态框 -->
    <div class="modal fade" id="deleteModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-exclamation-triangle" style="margin-right: 10px; color: var(--terminal-yellow);"></i>确认删除</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p>您确定要删除账号 <strong id="delete-username"></strong> 吗？</p>
                    <p class="text-muted" style="font-size: 14px;">此操作不可恢复，请谨慎操作。</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger" onclick="handleDeleteUser()">
                        <i class="fas fa-trash" style="margin-right: 5px;"></i>删除
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 检查登录状态
        function checkLoginStatus() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (isLoggedIn !== 'true') {
                window.location.href = 'login.html';
            }
        }

        // 获取所有用户
        function getUsers() {
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            return users;
        }

        // 保存用户
        function saveUsers(users) {
            localStorage.setItem('users', JSON.stringify(users));
        }

        // 更新统计数据
        function updateStats() {
            const users = getUsers();
            const totalUsers = users.length;
            const adminUsers = users.filter(u => u.role === 'admin').length;
            const regularUsers = users.filter(u => u.role === 'user').length;

            document.getElementById('total-users').textContent = totalUsers;
            document.getElementById('admin-users').textContent = adminUsers;
            document.getElementById('regular-users').textContent = regularUsers;
        }

        // 渲染用户表格
        function renderUsersTable(users) {
            const tbody = document.getElementById('users-table-body');
            const emptyState = document.getElementById('empty-state');

            if (users.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            tbody.innerHTML = users.map(user => `
                <tr>
                    <td>${user.id}</td>
                    <td><strong>${user.username}</strong></td>
                    <td>${user.realname || '-'}</td>
                    <td>${user.phone || '-'}</td>
                    <td>
                        <span class="badge ${user.role === 'admin' ? 'badge-info' : 'badge-success'}">
                            ${user.role === 'admin' ? '管理员' : '普通用户'}
                        </span>
                    </td>
                    <td>${formatDate(user.createdAt)}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn btn-sm btn-warning" onclick="openEditModal(${user.id})">
                                <i class="fas fa-edit"></i> 编辑
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="openDeleteModal(${user.id})">
                                <i class="fas fa-trash"></i> 删除
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // 格式化日期
        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 搜索用户
        function handleSearch() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const roleFilter = document.getElementById('role-filter').value;
            let users = getUsers();

            if (searchTerm) {
                users = users.filter(user => 
                    user.username.toLowerCase().includes(searchTerm) ||
                    (user.realname && user.realname.toLowerCase().includes(searchTerm)) ||
                    (user.phone && user.phone.includes(searchTerm))
                );
            }

            if (roleFilter) {
                users = users.filter(user => user.role === roleFilter);
            }

            renderUsersTable(users);
        }

        // 打开添加模态框
        function openAddModal() {
            document.getElementById('add-form').reset();
            $('#addModal').modal('show');
        }

        // 处理添加用户
        function handleAddUser() {
            const username = document.getElementById('add-username').value.trim();
            const password = document.getElementById('add-password').value;
            const realname = document.getElementById('add-realname').value.trim();
            const phone = document.getElementById('add-phone').value.trim();
            const role = document.getElementById('add-role').value;

            // 验证表单
            if (!username || !password || !realname || !role) {
                alert('请填写所有必填字段！');
                return;
            }

            // 检查用户名是否已存在
            const users = getUsers();
            if (users.find(u => u.username === username)) {
                alert('该用户名已被注册！');
                return;
            }

            // 创建新用户
            const newUser = {
                id: Date.now(),
                username: username,
                password: password,
                realname: realname,
                phone: phone,
                role: role,
                createdAt: new Date().toISOString()
            };

            // 保存用户
            users.push(newUser);
            saveUsers(users);

            // 关闭模态框并刷新表格
            $('#addModal').modal('hide');
            updateStats();
            handleSearch();
            alert('账号添加成功！');
        }

        // 打开编辑模态框
        function openEditModal(userId) {
            const users = getUsers();
            const user = users.find(u => u.id === userId);

            if (!user) {
                alert('用户不存在！');
                return;
            }

            document.getElementById('edit-id').value = user.id;
            document.getElementById('edit-username').value = user.username;
            document.getElementById('edit-password').value = '';
            document.getElementById('edit-realname').value = user.realname || '';
            document.getElementById('edit-phone').value = user.phone || '';
            document.getElementById('edit-role').value = user.role;

            $('#editModal').modal('show');
        }

        // 处理编辑用户
        function handleEditUser() {
            const id = parseInt(document.getElementById('edit-id').value);
            const username = document.getElementById('edit-username').value.trim();
            const password = document.getElementById('edit-password').value;
            const realname = document.getElementById('edit-realname').value.trim();
            const phone = document.getElementById('edit-phone').value.trim();
            const role = document.getElementById('edit-role').value;

            // 验证表单
            if (!username || !realname || !role) {
                alert('请填写所有必填字段！');
                return;
            }

            // 获取用户列表
            let users = getUsers();
            const userIndex = users.findIndex(u => u.id === id);

            if (userIndex === -1) {
                alert('用户不存在！');
                return;
            }

            // 检查用户名是否与其他用户冲突
            const existingUser = users.find(u => u.username === username && u.id !== id);
            if (existingUser) {
                alert('该用户名已被其他用户使用！');
                return;
            }

            // 更新用户信息
            users[userIndex] = {
                ...users[userIndex],
                username: username,
                realname: realname,
                phone: phone,
                role: role
            };

            // 如果提供了新密码，则更新密码
            if (password) {
                users[userIndex].password = password;
            }

            // 保存用户
            saveUsers(users);

            // 关闭模态框并刷新表格
            $('#editModal').modal('hide');
            updateStats();
            handleSearch();
            alert('账号更新成功！');
        }

        // 打开删除模态框
        function openDeleteModal(userId) {
            const users = getUsers();
            const user = users.find(u => u.id === userId);

            if (!user) {
                alert('用户不存在！');
                return;
            }

            document.getElementById('delete-username').textContent = user.username;
            document.getElementById('delete-username').dataset.userId = userId;

            $('#deleteModal').modal('show');
        }

        // 处理删除用户
        function handleDeleteUser() {
            const userId = parseInt(document.getElementById('delete-username').dataset.userId);
            let users = getUsers();
            const userIndex = users.findIndex(u => u.id === userId);

            if (userIndex === -1) {
                alert('用户不存在！');
                return;
            }

            // 删除用户
            users.splice(userIndex, 1);
            saveUsers(users);

            // 关闭模态框并刷新表格
            $('#deleteModal').modal('hide');
            updateStats();
            handleSearch();
            alert('账号删除成功！');
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            checkLoginStatus();
            updateStats();
            handleSearch();
        });
    </script>
</body>
</html>
