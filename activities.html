<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动管理 - 织金县文明传播志愿服务队</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>志愿服务队</h2>
                <p>织金县文明传播</p>
            </div>
            <nav class="sidebar-nav">
                <a href="/volunteer/index" class="nav-item">
                    <span>📊</span> 首页
                </a>
                <a href="/volunteer/members" class="nav-item">
                    <span>👥</span> 志愿者管理
                </a>
                <a href="/volunteer/activities" class="nav-item active">
                    <span>📅</span> 活动管理
                </a>
                <a href="/volunteer/users" class="nav-item">
                    <span>👤</span> 用户管理
                </a>
                <a href="/volunteer/logout" class="nav-item logout">
                    <span>🚪</span> 退出登录
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="header">
                <h1>活动管理</h1>
                <p class="welcome-text">管理志愿服务活动</p>
            </div>

            <div class="toolbar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索活动..." th:value="${keyword}">
                    <button onclick="searchActivities()">🔍 搜索</button>
                </div>
                <div class="action-buttons">
                    <a href="/volunteer/activities/new" class="btn btn-primary">➕ 添加活动</a>
                    <a href="/volunteer/activities/export" class="btn btn-success">📥 导出Excel</a>
                </div>
            </div>

            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>活动编号</th>
                            <th>活动名称</th>
                            <th>活动类型</th>
                            <th>开始时间</th>
                            <th>结束时间</th>
                            <th>地点</th>
                            <th>参与人数</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="activity : ${activities}">
                            <td th:text="${activity.activityId}"></td>
                            <td th:text="${activity.name}"></td>
                            <td th:text="${activity.type}"></td>
                            <td th:text="${activity.startTime != null ? #temporals.format(activity.startTime, 'yyyy-MM-dd HH:mm') : ''}"></td>
                            <td th:text="${activity.endTime != null ? #temporals.format(activity.endTime, 'yyyy-MM-dd HH:mm') : ''}"></td>
                            <td th:text="${activity.location}"></td>
                            <td th:text="${activity.participants}"></td>
                            <td>
                                <span class="status-badge" th:class="'status-' + ${activity.status}" th:text="${activity.status}"></span>
                            </td>
                            <td>
                                <a th:href="@{/volunteer/activities/edit/{id}(id=${activity.id})}" class="btn btn-sm btn-info">编辑</a>
                                <a th:href="@{/volunteer/activities/delete/{id}(id=${activity.id})}" class="btn btn-sm btn-danger" onclick="return confirm('确定要删除吗？')">删除</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination" th:if="${totalPages > 1}">
                <a th:if="${currentPage > 0}" th:href="@{/volunteer/activities(page=${currentPage - 1}, keyword=${keyword})}" class="btn btn-sm">上一页</a>
                <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                    <a th:if="${i != currentPage}" th:href="@{/volunteer/activities(page=${i}, keyword=${keyword})}" class="btn btn-sm" th:text="${i + 1}"></a>
                    <span th:if="${i == currentPage}" class="btn btn-sm btn-primary" th:text="${i + 1}"></span>
                </span>
                <a th:if="${currentPage < totalPages - 1}" th:href="@{/volunteer/activities(page=${currentPage + 1}, keyword=${keyword})}" class="btn btn-sm">下一页</a>
            </div>
        </main>
    </div>

    <script>
        function searchActivities() {
            const keyword = document.getElementById('searchInput').value;
            window.location.href = '/volunteer/activities?keyword=' + encodeURIComponent(keyword);
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchActivities();
            }
        });
    </script>
</body>
</html>
