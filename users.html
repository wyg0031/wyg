<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 织金县文明传播志愿服务队</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>志愿服务队</h2>
                <p>织金县文明传播</p>
            </div>
            <nav class="sidebar-nav">
                <a href="/volunteer/index" class="nav-item">
                    <span>📊</span> 首页
                </a>
                <a href="/volunteer/members" class="nav-item">
                    <span>👥</span> 志愿者管理
                </a>
                <a href="/volunteer/activities" class="nav-item">
                    <span>📅</span> 活动管理
                </a>
                <a href="/volunteer/users" class="nav-item active">
                    <span>👤</span> 用户管理
                </a>
                <a href="/volunteer/logout" class="nav-item logout">
                    <span>🚪</span> 退出登录
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="header">
                <h1>用户管理</h1>
                <p class="welcome-text">管理系统用户账户</p>
            </div>

            <div class="toolbar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索用户..." th:value="${keyword}">
                    <button onclick="searchUsers()">🔍 搜索</button>
                </div>
                <div class="action-buttons">
                    <a href="/volunteer/users/new" class="btn btn-primary">➕ 添加用户</a>
                </div>
            </div>

            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>用户名</th>
                            <th>角色</th>
                            <th>邮箱</th>
                            <th>电话</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.username}"></td>
                            <td>
                                <span class="status-badge" th:class="'role-' + ${user.role}" th:text="${user.role}"></span>
                            </td>
                            <td th:text="${user.email}"></td>
                            <td th:text="${user.phone}"></td>
                            <td>
                                <span class="status-badge" th:class="${user.enabled ? 'status-enabled' : 'status-disabled'}" 
                                      th:text="${user.enabled ? '启用' : '禁用'}"></span>
                            </td>
                            <td>
                                <a th:href="@{/volunteer/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-info">编辑</a>
                                <a th:href="@{/volunteer/users/toggle/{id}(id=${user.id})}" 
                                   class="btn btn-sm" 
                                   th:class="${user.enabled ? 'btn-warning' : 'btn-success'}"
                                   th:text="${user.enabled ? '禁用' : '启用'}"></a>
                                <a th:href="@{/volunteer/users/delete/{id}(id=${user.id})}" 
                                   class="btn btn-sm btn-danger" 
                                   onclick="return confirm('确定要删除吗？')"
                                   th:if="${user.role != 'ADMIN'}">删除</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination" th:if="${totalPages > 1}">
                <a th:if="${currentPage > 0}" th:href="@{/volunteer/users(page=${currentPage - 1}, keyword=${keyword})}" class="btn btn-sm">上一页</a>
                <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                    <a th:if="${i != currentPage}" th:href="@{/volunteer/users(page=${i}, keyword=${keyword})}" class="btn btn-sm" th:text="${i + 1}"></a>
                    <span th:if="${i == currentPage}" class="btn btn-sm btn-primary" th:text="${i + 1}"></span>
                </span>
                <a th:if="${currentPage < totalPages - 1}" th:href="@{/volunteer/users(page=${currentPage + 1}, keyword=${keyword})}" class="btn btn-sm">下一页</a>
            </div>
        </main>
    </div>

    <script>
        function searchUsers() {
            const keyword = document.getElementById('searchInput').value;
            window.location.href = '/volunteer/users?keyword=' + encodeURIComponent(keyword);
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchUsers();
            }
        });
    </script>
</body>
</html>
