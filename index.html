<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>织金县文明传播志愿服务队人员信息管理系统 - 登录</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        :root {
            --primary-color: #e74c3c;
            --primary-dark: #c0392b;
            --secondary-color: #ffffff;
            --success-color: #27ae60;
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
            --info-color: #3498db;
            --dark-bg: #0a0a0a;
            --light-bg: #1a1a1a;
            --card-bg: rgba(20, 0, 0, 0.95);
            --text-color: #ffffff;
            --border-color: #8b0000;
            --terminal-bg: #0a0000;
            --terminal-text: #ffffff;
            --terminal-green: #e74c3c;
            --terminal-blue: #ff4444;
            --terminal-yellow: #ffaa00;
            --terminal-red: #ff0000;
            --tech-red: #ffffff;
            --tech-dark-red: #8b0000;
            --tech-glow: rgba(255, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--terminal-bg);
            color: var(--terminal-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                linear-gradient(rgba(10, 0, 0, 0.85), rgba(10, 0, 0, 0.85)),
                url('Image_1766735724682_850.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            border: 2px solid var(--tech-dark-red);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.4), inset 0 0 20px rgba(255, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--tech-red), transparent);
            animation: scanline 3s linear infinite;
        }

        .login-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(255, 0, 0, 0.03) 2px,
                rgba(255, 0, 0, 0.03) 4px
            );
            pointer-events: none;
        }

        @keyframes scanline {
            0% {
                top: 0;
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
            100% {
                top: 100%;
                opacity: 1;
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--tech-red);
            margin-bottom: 10px;
            text-shadow: 0 0 10px var(--tech-glow);
            letter-spacing: 2px;
        }

        .login-header p {
            color: var(--secondary-color);
            font-size: 14px;
        }

        .login-header .icon {
            font-size: 48px;
            color: var(--tech-red);
            margin-bottom: 15px;
            text-shadow: 0 0 20px var(--tech-glow);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                text-shadow: 0 0 20px var(--tech-glow);
            }
            50% {
                transform: scale(1.05);
                text-shadow: 0 0 30px var(--tech-glow);
            }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--terminal-text);
            font-weight: 500;
            font-size: 14px;
        }

        .form-control {
            background: rgba(20, 0, 0, 0.8);
            border: 1px solid var(--tech-dark-red);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--terminal-text);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(20, 0, 0, 0.9);
            border-color: var(--tech-red);
            box-shadow: 0 0 10px var(--tech-glow);
            outline: none;
        }

        .form-control::placeholder {
            color: rgba(255, 204, 204, 0.4);
        }

        .input-group-text {
            background: rgba(20, 0, 0, 0.8);
            border: 1px solid var(--tech-dark-red);
            border-right: none;
            color: var(--tech-red);
        }

        .input-group .form-control {
            border-left: none;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--tech-red), var(--tech-dark-red));
            border: 2px solid var(--tech-red);
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 15px var(--tech-glow);
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #ff3333, #cc0000);
            transform: translateY(-2px);
            box-shadow: 0 0 25px var(--tech-glow), 0 5px 15px rgba(255, 0, 0, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
            box-shadow: 0 0 10px var(--tech-glow);
        }

        .login-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(48, 54, 61, 0.5);
        }

        .login-footer p {
            color: var(--secondary-color);
            font-size: 12px;
            margin: 0;
        }

        .login-footer a {
            color: var(--tech-red);
            text-decoration: none;
            text-shadow: 0 0 5px var(--tech-glow);
        }

        .login-footer a:hover {
            text-decoration: underline;
            text-shadow: 0 0 10px var(--tech-glow);
        }

        .alert {
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            margin-bottom: 20px;
            border: none;
        }

        .alert-danger {
            background: rgba(255, 0, 0, 0.15);
            color: #ff6666;
            border: 1px solid var(--tech-dark-red);
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
        }

        .alert-success {
            background: rgba(255, 0, 0, 0.1);
            color: #ff9999;
            border: 1px solid var(--tech-dark-red);
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-login.loading .loading-spinner {
            display: inline-block;
        }

        .btn-login.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .remember-me input[type="checkbox"] {
            margin-right: 8px;
            accent-color: var(--tech-red);
        }

        .remember-me label {
            margin: 0;
            color: var(--terminal-text);
            font-size: 14px;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"]:checked + label {
            color: var(--tech-red);
            text-shadow: 0 0 5px var(--tech-glow);
        }

        @media (max-width: 576px) {
            .login-card {
                padding: 30px 20px;
            }

            .login-header h1 {
                font-size: 20px;
            }

            .login-header .icon {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="icon">
                    <i class="fas fa-users-cog"></i>
                </div>
                <h1>织金县文明传播志愿服务队</h1>
                <p>人员信息管理系统</p>
            </div>

            <div id="alert-container"></div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text">
                                <i class="fas fa-user"></i>
                            </span>
                        </div>
                        <input type="text" 
                               class="form-control" 
                               id="username" 
                               placeholder="请输入用户名" 
                               required
                               autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text">
                                <i class="fas fa-lock"></i>
                            </span>
                        </div>
                        <input type="password" 
                               class="form-control" 
                               id="password" 
                               placeholder="请输入密码" 
                               required
                               autocomplete="current-password">
                    </div>
                </div>

                <div class="remember-me">
                    <input type="checkbox" id="remember-me">
                    <label for="remember-me">记住我</label>
                </div>

                <button type="submit" class="btn btn-login" id="login-btn">
                    <span class="loading-spinner"></span>
                    <span class="btn-text">登录</span>
                </button>
            </form>

            <div class="login-footer">
                <p>还没有账号？ <a href="#" onclick="toggleRegisterForm()">立即注册</a></p>
                <p>© 2024 织金县文明传播志愿服务队 | <a href="#">技术支持</a></p>
            </div>
        </div>

        <!-- 注册表单 -->
        <div class="login-card" id="register-card" style="display: none;">
            <div class="login-header">
                <div class="icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1>账号注册</h1>
                <p>创建您的账号</p>
            </div>

            <div id="register-alert-container"></div>

            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="reg-username">用户名 *</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text">
                                <i class="fas fa-user"></i>
                            </span>
                        </div>
                        <input type="text" 
                               class="form-control" 
                               id="reg-username" 
                               placeholder="请输入用户名（3-20个字符）" 
                               required
                               pattern="[a-zA-Z0-9_]{3,20}"
                               title="用户名只能包含字母、数字和下划线，长度3-20个字符">
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-password">密码 *</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text">
                                <i class="fas fa-lock"></i>
                            </span>
                        </div>
                        <input type="password" 
                               class="form-control" 
                               id="reg-password" 
                               placeholder="请输入密码（至少6个字符）" 
                               required
                               minlength="6"
                               title="密码至少6个字符">
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-confirm-password">确认密码 *</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text">
                                <i class="fas fa-lock"></i>
                            </span>
                        </div>
                        <input type="password" 
                               class="form-control" 
                               id="reg-confirm-password" 
                               placeholder="请再次输入密码" 
                               required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-realname">真实姓名 *</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text">
                                <i class="fas fa-id-card"></i>
                            </span>
                        </div>
                        <input type="text" 
                               class="form-control" 
                               id="reg-realname" 
                               placeholder="请输入真实姓名" 
                               required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-phone">手机号码</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text">
                                <i class="fas fa-phone"></i>
                            </span>
                        </div>
                        <input type="tel" 
                               class="form-control" 
                               id="reg-phone" 
                               placeholder="请输入手机号码"
                               pattern="[0-9]{11}"
                               title="请输入11位手机号码">
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-role">角色</label>
                    <select class="form-control" id="reg-role">
                        <option value="user">普通用户</option>
                        <option value="admin">管理员</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-login" id="register-btn">
                    <span class="loading-spinner"></span>
                    <span class="btn-text">注册</span>
                </button>
            </form>

            <div class="login-footer">
                <p>已有账号？ <a href="#" onclick="toggleRegisterForm()">立即登录</a></p>
            </div>
        </div>
    </div>

    <script>
        // 检查是否已登录
        function checkLoginStatus() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (isLoggedIn === 'true') {
                window.location.href = 'index_local.html';
            }
        }

        // 切换登录/注册表单
        function toggleRegisterForm() {
            const loginCard = document.querySelector('.login-container > .login-card:first-of-type');
            const registerCard = document.getElementById('register-card');
            
            if (registerCard.style.display === 'none') {
                loginCard.style.display = 'none';
                registerCard.style.display = 'block';
            } else {
                registerCard.style.display = 'none';
                loginCard.style.display = 'block';
            }
        }

        // 显示提示信息
        function showAlert(message, type = 'danger', containerId = 'alert-container') {
            const alertContainer = document.getElementById(containerId);
            const alertHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
            `;
            alertContainer.innerHTML = alertHTML;

            // 3秒后自动关闭
            setTimeout(() => {
                const alert = alertContainer.querySelector('.alert');
                if (alert) {
                    alert.classList.remove('show');
                    setTimeout(() => {
                        alert.remove();
                    }, 150);
                }
            }, 3000);
        }

        // 处理登录
        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('login-btn');
            const rememberMe = document.getElementById('remember-me').checked;

            // 显示加载状态
            loginBtn.classList.add('loading');
            loginBtn.querySelector('.btn-text').textContent = '登录中...';

            // 模拟登录验证（实际项目中应该调用后端API）
            setTimeout(() => {
                // 从localStorage获取所有注册的账号
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                
                // 查找匹配的用户
                const user = users.find(u => u.username === username && u.password === password);

                if (user || (username === 'admin' && password === 'admin123')) {
                    // 登录成功
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('username', username);
                    localStorage.setItem('userRole', user ? user.role : 'admin');

                    if (rememberMe) {
                        localStorage.setItem('rememberMe', 'true');
                    } else {
                        localStorage.removeItem('rememberMe');
                    }

                    showAlert('登录成功！正在跳转...', 'success');

                    setTimeout(() => {
                        window.location.href = 'index_local.html';
                    }, 1000);
                } else {
                    // 登录失败
                    showAlert('用户名或密码错误！', 'danger');
                    loginBtn.classList.remove('loading');
                    loginBtn.querySelector('.btn-text').textContent = '登录';
                }
            }, 1000);
        }

        // 处理注册
        function handleRegister(event) {
            event.preventDefault();

            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;
            const realname = document.getElementById('reg-realname').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const role = document.getElementById('reg-role').value;
            const registerBtn = document.getElementById('register-btn');

            // 验证密码是否一致
            if (password !== confirmPassword) {
                showAlert('两次输入的密码不一致！', 'danger', 'register-alert-container');
                return;
            }

            // 显示加载状态
            registerBtn.classList.add('loading');
            registerBtn.querySelector('.btn-text').textContent = '注册中...';

            // 从localStorage获取所有注册的账号
            const users = JSON.parse(localStorage.getItem('users') || '[]');

            // 检查用户名是否已存在
            if (users.find(u => u.username === username)) {
                showAlert('该用户名已被注册！', 'danger', 'register-alert-container');
                registerBtn.classList.remove('loading');
                registerBtn.querySelector('.btn-text').textContent = '注册';
                return;
            }

            // 模拟注册（实际项目中应该调用后端API）
            setTimeout(() => {
                // 创建新用户
                const newUser = {
                    id: Date.now(),
                    username: username,
                    password: password,
                    realname: realname,
                    phone: phone,
                    role: role,
                    createdAt: new Date().toISOString()
                };

                // 保存到localStorage
                users.push(newUser);
                localStorage.setItem('users', JSON.stringify(users));

                showAlert('注册成功！请登录', 'success', 'register-alert-container');

                // 清空表单
                document.getElementById('register-form').reset();

                // 延迟切换到登录表单
                setTimeout(() => {
                    toggleRegisterForm();
                }, 1500);
            }, 1000);
        }

        // 页面加载时检查登录状态
        document.addEventListener('DOMContentLoaded', function() {
            checkLoginStatus();

            // 检查是否记住密码
            const rememberMe = localStorage.getItem('rememberMe');
            if (rememberMe === 'true') {
                document.getElementById('remember-me').checked = true;
            }

            // 回车键提交表单
            document.getElementById('password').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    handleLogin(e);
                }
            });
        });
    </script>
</body>
</html>
