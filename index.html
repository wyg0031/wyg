<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - 织金县文明传播志愿服务队</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>志愿服务队</h2>
                <p>织金县文明传播</p>
            </div>
            <nav class="sidebar-nav">
                <a href="/volunteer/index" class="nav-item active">
                    <span>📊</span> 首页
                </a>
                <a href="/volunteer/members" class="nav-item">
                    <span>👥</span> 志愿者管理
                </a>
                <a href="/volunteer/activities" class="nav-item">
                    <span>📅</span> 活动管理
                </a>
                <a href="/volunteer/users" class="nav-item">
                    <span>👤</span> 用户管理
                </a>
                <a href="/volunteer/logout" class="nav-item logout">
                    <span>🚪</span> 退出登录
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="header">
                <div>
                    <h1>欢迎回来</h1>
                    <p class="welcome-text">织金县文明传播志愿服务队管理系统</p>
                </div>
                <div class="user-info">
                    <span th:text="${#authentication.name}">管理员</span>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3>志愿者总数</h3>
                    <div class="value" th:text="${memberCount}">0</div>
                </div>
                <div class="stat-card">
                    <h3>活动总数</h3>
                    <div class="value" th:text="${activityCount}">0</div>
                </div>
                <div class="stat-card">
                    <h3>进行中活动</h3>
                    <div class="value" th:text="${ongoingActivityCount}">0</div>
                </div>
                <div class="stat-card">
                    <h3>系统用户</h3>
                    <div class="value" th:text="${userCount}">0</div>
                </div>
            </div>

            <div class="content-section">
                <h2>最新活动</h2>
                <ul class="activity-list" th:if="${!recentActivities.isEmpty()}">
                    <li class="activity-item" th:each="activity : ${recentActivities}">
                        <div class="activity-info">
                            <h4 th:text="${activity.name}">活动名称</h4>
                            <p th:text="${activity.startTime != null ? #temporals.format(activity.startTime, 'yyyy-MM-dd HH:mm') : ''}">时间</p>
                        </div>
                        <span class="activity-status" 
                              th:class="'status-' + ${activity.status}" 
                              th:text="${activity.status}">状态</span>
                    </li>
                </ul>
                <div class="no-data" th:if="${recentActivities.isEmpty()}">
                    暂无活动数据
                </div>
            </div>
        </main>
    </div>
</body>
</html>
