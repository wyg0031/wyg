<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索 - 织金县文明传播志愿服务队人员信息管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        :root {
            --primary-color: #e74c3c;
            --primary-dark: #c0392b;
            --primary-light: #ffe5e5;
            --secondary-color: #ffffff;
            --success-color: #27ae60;
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
            --info-color: #3498db;
            --terminal-bg: #0a0000;
            --terminal-text: #ffffff;
            --terminal-green: #e74c3c;
            --terminal-blue: #ff4444;
            --terminal-yellow: #ffaa00;
            --terminal-red: #ff0000;
            --terminal-purple: #cc0066;
            --terminal-cyan: #ff6666;
            --sidebar-bg: #140000;
            --sidebar-hover: #1a0000;
            --sidebar-active: #220000;
            --card-bg: rgba(20, 0, 0, 0.95);
            --border-color: #8b0000;
            --tech-red: #ffffff;
            --tech-dark-red: #8b0000;
            --tech-glow: rgba(255, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--terminal-bg);
            color: var(--terminal-text);
            min-height: 100vh;
            background-image: 
                linear-gradient(rgba(10, 0, 0, 0.85), rgba(10, 0, 0, 0.85)),
                url('Image_1766735724682_850.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .navbar {
            background: rgba(20, 0, 0, 0.95) !important;
            border-bottom: 2px solid var(--tech-dark-red);
            padding: 15px 20px;
            box-shadow: 0 0 20px var(--tech-glow);
        }

        .navbar-brand {
            color: var(--terminal-text) !important;
            font-weight: 600;
            font-size: 1.2rem;
            text-shadow: 0 0 10px var(--tech-glow);
        }

        .navbar-brand i {
            color: var(--tech-red);
            margin-right: 8px;
        }

        .nav-link {
            color: var(--terminal-text) !important;
            font-weight: 500;
            padding: 8px 16px !important;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            background: rgba(255, 0, 0, 0.2);
            color: var(--tech-red) !important;
            box-shadow: 0 0 10px var(--tech-glow);
        }

        .nav-link.active {
            background: rgba(255, 0, 0, 0.3);
            color: var(--tech-red) !important;
            box-shadow: 0 0 15px var(--tech-glow);
        }

        .container {
            max-width: 1200px;
            padding: 20px;
        }

        .page-header {
            margin-bottom: 30px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 10px;
            border: 2px solid var(--tech-dark-red);
            box-shadow: 0 0 15px var(--tech-glow);
        }

        .page-header h1 {
            font-size: 28px;
            font-weight: 600;
            color: var(--tech-red);
            margin-bottom: 8px;
            text-shadow: 0 0 10px var(--tech-glow);
        }

        .page-header p {
            color: var(--secondary-color);
            font-size: 14px;
            margin: 0;
        }

        .search-card {
            background: var(--card-bg);
            border: 2px solid var(--tech-dark-red);
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 0 15px var(--tech-glow);
        }

        .search-card h3 {
            color: var(--tech-red);
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--tech-glow);
        }

        .search-card h3 i {
            color: var(--tech-red);
            margin-right: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--terminal-text);
            font-weight: 500;
            font-size: 14px;
        }

        .form-control {
            background: rgba(10, 0, 0, 0.8);
            border: 2px solid var(--tech-dark-red);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--terminal-text);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(10, 0, 0, 0.9);
            border-color: var(--tech-red);
            box-shadow: 0 0 15px var(--tech-glow);
            outline: none;
        }

        .form-control::placeholder {
            color: rgba(255, 204, 204, 0.5);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--tech-red), #cc0000);
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #cc0000, #990000);
            transform: translateY(-2px);
            box-shadow: 0 0 20px var(--tech-glow);
        }

        .btn-outline-secondary {
            border-color: var(--tech-dark-red);
            color: var(--terminal-text);
            background: transparent;
            border-radius: 8px;
            padding: 12px 24px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-outline-secondary:hover {
            background: rgba(255, 0, 0, 0.2);
            border-color: var(--tech-red);
            color: var(--tech-red);
            box-shadow: 0 0 10px var(--tech-glow);
        }

        .results-card {
            background: var(--card-bg);
            border: 2px solid var(--tech-dark-red);
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 0 15px var(--tech-glow);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--tech-dark-red);
        }

        .results-header h3 {
            color: var(--tech-red);
            font-size: 20px;
            font-weight: 600;
            margin: 0;
            text-shadow: 0 0 10px var(--tech-glow);
        }

        .results-header h3 i {
            color: var(--tech-red);
            margin-right: 8px;
        }

        .search-summary {
            background: rgba(255, 0, 0, 0.15);
            border: 2px solid var(--tech-dark-red);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--tech-red);
            font-size: 14px;
            margin-bottom: 20px;
            box-shadow: 0 0 10px var(--tech-glow);
        }

        .table {
            background: rgba(10, 0, 0, 0.6);
            border-radius: 8px;
            overflow: hidden;
        }

        .table thead {
            background: var(--card-bg);
        }

        .table th {
            color: var(--tech-red);
            font-weight: 600;
            padding: 12px 16px;
            border-bottom: 2px solid var(--tech-dark-red);
        }

        .table td {
            color: var(--terminal-text);
            padding: 12px 16px;
            border-bottom: 1px solid var(--tech-dark-red);
        }

        .table tbody tr:hover {
            background: rgba(255, 0, 0, 0.1);
            box-shadow: 0 0 10px var(--tech-glow);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-primary {
            background: rgba(255, 0, 0, 0.2);
            color: var(--tech-red);
            border: 2px solid var(--tech-dark-red);
        }

        .badge-success {
            background: rgba(255, 0, 0, 0.2);
            color: var(--tech-red);
            border: 2px solid var(--tech-dark-red);
        }

        .badge-warning {
            background: rgba(255, 170, 0, 0.2);
            color: var(--terminal-yellow);
            border: 2px solid var(--tech-dark-red);
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--secondary-color);
        }

        .no-results i {
            font-size: 64px;
            color: var(--secondary-color);
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .no-results h4 {
            font-size: 20px;
            margin-bottom: 10px;
            color: var(--terminal-text);
        }

        .no-results p {
            font-size: 14px;
            margin: 0;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--terminal-blue);
        }

        .loading i {
            font-size: 48px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
        }

        .btn-info {
            background: rgba(56, 139, 253, 0.2);
            border-color: rgba(56, 139, 253, 0.5);
            color: var(--terminal-blue);
        }

        .btn-info:hover {
            background: rgba(56, 139, 253, 0.3);
            border-color: var(--terminal-blue);
            color: var(--terminal-blue);
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .search-card,
            .results-card {
                padding: 15px;
            }

            .page-header h1 {
                font-size: 22px;
            }

            .table-responsive {
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index_local.html">
                <i class="fas fa-home"></i>
                返回首页
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index_local.html">
                            <i class="fas fa-home"></i> 首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index_local.html" onclick="showPage('members')">
                            <i class="fas fa-users"></i> 团员信息
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index_local.html" onclick="showPage('activities')">
                            <i class="fas fa-calendar-alt"></i> 活动信息
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="search.html">
                            <i class="fas fa-search"></i> 搜索
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-search"></i> 搜索中心</h1>
            <p>快速查找团员信息和活动记录</p>
        </div>

        <div class="search-card">
            <h3><i class="fas fa-filter"></i> 搜索条件</h3>
            <div class="row">
                <div class="col-md-2">
                    <div class="form-group">
                        <label for="search-type">搜索类型</label>
                        <select class="form-control" id="search-type">
                            <option value="members">团员信息</option>
                            <option value="activities">活动信息</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="search-input">搜索关键词</label>
                        <input type="text" 
                               class="form-control" 
                               id="search-input" 
                               placeholder="输入姓名、手机号码、团员编号或活动名称...">
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="form-group">
                        <label>&nbsp;</label>
                        <button class="btn btn-primary btn-block" onclick="performSearch()">
                            <i class="fas fa-search"></i> 搜索
                        </button>
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="form-group">
                        <label>&nbsp;</label>
                        <button class="btn btn-outline-secondary btn-block" onclick="resetSearch()">
                            <i class="fas fa-redo"></i> 重置
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="results-card" id="results-card" style="display: none;">
            <div class="results-header">
                <h3><i class="fas fa-list"></i> 搜索结果</h3>
                <button class="btn btn-info btn-sm" onclick="printResults()">
                    <i class="fas fa-print"></i> 打印结果
                </button>
            </div>

            <div class="search-summary" id="search-summary" style="display: none;">
                找到 <strong id="result-count">0</strong> 个匹配的结果
            </div>

            <div id="loading-spinner" class="loading" style="display: none;">
                <i class="fas fa-spinner"></i>
                <p>搜索中...</p>
            </div>

            <div id="no-results" class="no-results" style="display: none;">
                <i class="fas fa-search-minus"></i>
                <h4>未找到匹配的结果</h4>
                <p>请尝试使用不同的关键词进行搜索</p>
            </div>

            <div id="results-container" style="display: none;">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead id="results-thead">
                        </thead>
                        <tbody id="results-tbody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 从localStorage获取数据
        function getData() {
            const members = JSON.parse(localStorage.getItem('members') || '[]');
            const activities = JSON.parse(localStorage.getItem('activities') || '[]');
            return { members, activities };
        }

        // 执行搜索
        function performSearch() {
            const searchType = document.getElementById('search-type').value;
            const searchInput = document.getElementById('search-input').value.trim().toLowerCase();
            const resultsCard = document.getElementById('results-card');
            const loadingSpinner = document.getElementById('loading-spinner');
            const noResults = document.getElementById('no-results');
            const resultsContainer = document.getElementById('results-container');
            const searchSummary = document.getElementById('search-summary');
            const resultCount = document.getElementById('result-count');

            if (!searchInput) {
                alert('请输入搜索关键词！');
                return;
            }

            // 显示加载状态
            resultsCard.style.display = 'block';
            loadingSpinner.style.display = 'block';
            noResults.style.display = 'none';
            resultsContainer.style.display = 'none';
            searchSummary.style.display = 'none';

            // 模拟搜索延迟
            setTimeout(() => {
                const { members, activities } = getData();
                let results = [];
                let tableHeaders = '';

                if (searchType === 'members') {
                    // 搜索团员信息
                    results = members.filter(member => {
                        return member.name.toLowerCase().includes(searchInput) ||
                               member.phone.includes(searchInput) ||
                               member.memberNumber.toLowerCase().includes(searchInput) ||
                               member.ethnicity.toLowerCase().includes(searchInput);
                    });

                    tableHeaders = `
                        <tr>
                            <th>姓名</th>
                            <th>性别</th>
                            <th>出生年月</th>
                            <th>民族</th>
                            <th>手机号码</th>
                            <th>团员发展编号</th>
                            <th>入团年月</th>
                        </tr>
                    `;
                } else {
                    // 搜索活动信息
                    results = activities.filter(activity => {
                        return activity.title.toLowerCase().includes(searchInput) ||
                               activity.location.toLowerCase().includes(searchInput) ||
                               activity.participantsNames.toLowerCase().includes(searchInput);
                    });

                    tableHeaders = `
                        <tr>
                            <th>活动名称</th>
                            <th>活动日期</th>
                            <th>活动地点</th>
                            <th>参与人数</th>
                            <th>参与人员</th>
                        </tr>
                    `;
                }

                // 隐藏加载状态
                loadingSpinner.style.display = 'none';

                // 显示结果
                if (results.length > 0) {
                    searchSummary.style.display = 'block';
                    resultCount.textContent = results.length;
                    resultsContainer.style.display = 'block';

                    document.getElementById('results-thead').innerHTML = tableHeaders;

                    let tableBody = '';
                    if (searchType === 'members') {
                        results.forEach(member => {
                            tableBody += `
                                <tr>
                                    <td>${member.name}</td>
                                    <td><span class="badge badge-primary">${member.gender}</span></td>
                                    <td>${member.birthDate}</td>
                                    <td>${member.ethnicity}</td>
                                    <td>${member.phone}</td>
                                    <td>${member.memberNumber}</td>
                                    <td>${member.joinYear}</td>
                                </tr>
                            `;
                        });
                    } else {
                        results.forEach(activity => {
                            tableBody += `
                                <tr>
                                    <td>${activity.title}</td>
                                    <td>${activity.date}</td>
                                    <td>${activity.location}</td>
                                    <td><span class="badge badge-success">${activity.participants}</span></td>
                                    <td>${activity.participantsNames}</td>
                                </tr>
                            `;
                        });
                    }

                    document.getElementById('results-tbody').innerHTML = tableBody;
                } else {
                    noResults.style.display = 'block';
                }
            }, 500);
        }

        // 重置搜索
        function resetSearch() {
            document.getElementById('search-input').value = '';
            document.getElementById('results-card').style.display = 'none';
        }

        // 打印结果
        function printResults() {
            window.print();
        }

        // 回车键搜索
        document.getElementById('search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        // 页面加载时检查登录状态
        document.addEventListener('DOMContentLoaded', function() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (isLoggedIn !== 'true') {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
